# Publish both environments to the single GitHub Pages site.
#
#   main → https://leonidas47dario.github.io/Fish2tank/        (production)
#   uat  → https://leonidas47dario.github.io/Fish2tank/uat/    (staging)
#
# GitHub Pages serves one site per repository, so both environments are built
# here and assembled into a single artifact. That is why a push to EITHER
# branch rebuilds BOTH: the artifact is published whole, and publishing only
# half of it would delete the other environment.
#
# Branch flow: feature → uat → main. Nothing reaches production without having
# been live on /uat/ first.
name: Deploy

on:
  push:
    branches: [main, uat]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer commit supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Each environment is built from its own branch, not from whichever
      # branch happened to trigger this run.
      - name: Check out production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      # BUG-19. This answer decides whether /uat/ is included in the artifact,
      # and the artifact is published WHOLE - so a wrong "no" here does not skip
      # staging, it DELETES it. That makes every non-answer dangerous, and there
      # were two:
      #
      #   - The call was anonymous. A private repository answers 404 to an
      #     unauthenticated ls-remote, which is indistinguishable from "no such
      #     branch", so making this repo private would have silently deleted
      #     /uat/ on the next deploy.
      #   - Every other failure - a network blip, a rate limit, an outage -
      #     took the same branch. A transient error deleted staging.
      #
      # So: authenticate, and treat only git's own "no matching refs" (exit 2)
      # as a real no. Anything else fails the job, because publishing half the
      # site is worse than not publishing.
      - name: Does a uat branch exist yet?
        id: uat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git ls-remote --exit-code --heads \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            uat >/dev/null 2>&1
          rc=$?
          set -e

          case "$rc" in
            0)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              # git's documented "no matching refs". The only safe no.
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No uat branch yet; publishing production only."
              ;;
            *)
              echo "::error::Could not determine whether a uat branch exists (git ls-remote exit $rc)."
              cat <<'MSG'
          This step could not reach the remote, which is NOT the same as there
          being no uat branch - and the difference matters, because the Pages
          artifact is published whole. Continuing would publish production
          alone and delete the live /uat/ site.

          Failing instead. Re-run the job; if it keeps failing, check whether
          the repository is reachable and whether GITHUB_TOKEN still has
          contents:read.
          MSG
              exit 1
              ;;
          esac

      - name: Check out staging (uat)
        if: steps.uat.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: uat
          path: uat

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- production ------------------------------------------------------
      - name: Build production
        working-directory: prod
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      # --- staging ---------------------------------------------------------
      # Staging runs the tests too. The point of a staging site is to exercise
      # a real release candidate, not any candidate.
      - name: Build staging
        if: steps.uat.outputs.exists == 'true'
        working-directory: uat
        env:
          VITE_BASE: /${{ github.event.repository.name }}/uat/
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r prod/dist/. site/
          if [ "${{ steps.uat.outputs.exists }}" = "true" ]; then
            mkdir -p site/uat
            cp -r uat/dist/. site/uat/
          fi
          echo "--- published tree ---"
          find site -maxdepth 2 -type d | sort

      # enablement:true turns Pages on via the API when it has never been
      # configured, so a fork gets a working deploy without manual setup.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
