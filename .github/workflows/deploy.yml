# Build the PWA and publish it to GitHub Pages.
#
# Pages on a PRIVATE repository requires a paid GitHub plan; this repository is
# public, so the free plan covers it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The engines are the product's honesty guarantee - a deploy that skips
      # them is not worth shipping.
      - name: Test
        run: npm test

      - name: Build
        env:
          # Project Pages serves from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # enablement:true turns Pages on via the API when it has never been
      # configured, instead of failing with a 404 and requiring someone to
      # click through repository settings first. Also means a fork gets a
      # working deploy without manual setup.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
